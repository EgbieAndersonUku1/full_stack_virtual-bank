<!--
==============================================================================
Component: Request Status

Purpose:
Displays a summary of the selected card request, including the requester's
profile information and the current application status.

Dynamic Content:
- Full name
- Email address
- Current request status
- Application submission date
- Profile image

JavaScript populates the placeholder elements using their respective IDs.
==============================================================================
-->

<section
  class="request-status flex flex-space-between"
  aria-labelledby="request-status-title"
>
  <h6 id="request-status-title" class="sr-only">Request status overview</h6>

  <div class="profile-details flex">

    <!-- the profile image -->
    <div class="profile-pic mr-4">
      <img
        src="/static/images/icons/profile.png"
        alt="Profile placeholder image"
        id="request-status-profile-pic"
      />
    </div>


    <div class="profile-information mt-12">

      <!-- the full name -->
      <p class="bold capitalise">
        <small id="full-name"></small>
      </p>

      <!-- The email -->
      <p>
        <small>
          <a href="#" id="profile-email"> </a>
        </small>
      </p>
    </div>
  </div>

  <div
    class="rquest-current-status flex-grid"
    aria-label="Request status details"
  >

    <!-- status -->
    <span
      class=""
      id="current-status"

    >

    </span>

    <span><small id="application-submission-date" class="text-muted"></small> </span>


  </div>
</section>
