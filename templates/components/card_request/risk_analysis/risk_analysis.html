  <section id="risk-analysis" class="mt-24">
    <div class="risk-analysis__container">
      <h2 class="header-8">Risk Analysis</h2>
      <p class="text-muted mb-16">
        Assess customer risk indicators and compliance status.
      </p>

      <div class="risk-factors-overview mt-24">
        <div id="risk-analysis-checklist" class="mb-16">
          <!-- Generate by JS -->
        </div>

        <div id="rules" class="mt-8 mb-16">
          <!-- generated by JavaScript -->
        </div>

        <!-- Decision panel -->
        <div id="decision" class="mt-16 decision-panel">
          <h2 class="header-8">Decision outcome</h2>

          <p class="text-muted decision-subtitle">
            Final risk score based on completed verification checks.
          </p>

          <div id="decisions" class="mt-8 decision-panel">
            <span class="bold">Our Recommendation: </span>
            <span id="our-recommendation"></span>

            <div class="decision-circle">
              <div class="decision-circle-inner">
                <span class="decision-score" id="decision-score">0</span>
                <span class="decision-max" id="decision-max">/ 0</span>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-24 mb-24" id="see-full-report-container">
          <a href="#" id="full-report-link">See full report</a>
        </div>

        <div id="full-report">
          <div class="spinner center" id="full-report-spinner"></div>
        </div>
      </div>

      <button
        type="button"
        class="btn-large blue-bg white-text"
        id="risk-button-analyser"
      >
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        Risk Analysis
      </button>
    </div>
  </section>
