{% load static %}

<section id="bank-pin-transaction">
    <div class="add-pin__container center">

        <img src="{% static 'images/icons/lock.svg' %}" alt="" class="mt-48" id="pin-lock-img">

        <form action="" id="bank-pin-transaction-form" method="post">

            <fieldset class="form-row">
                <legend class="mb-16">Enter your six digit PIN</legend>

                <div class="flex-grid six-column-grid" id="bank-pin-input-fields">
                    <input type="text" name="pin_1" id="pin_1" maxlength="1" inputmode="numeric" aria-label="PIN digit 1" required>
                    <input type="text" name="pin_2" id="pin_2" maxlength="1" inputmode="numeric" aria-label="PIN digit 2" required>
                    <input type="text" name="pin_3" id="pin_3" maxlength="1" inputmode="numeric" aria-label="PIN digit 3" required>
                    <input type="text" name="pin_4" id="pin_4" maxlength="1" inputmode="numeric" aria-label="PIN digit 4" required>
                    <input type="text" name="pin_5" id="pin_5" maxlength="1" inputmode="numeric" aria-label="PIN digit 5" required>
                    <input type="text" name="pin_6" id="pin_6" maxlength="1" inputmode="numeric" aria-label="PIN digit 6" required>
                </div>
            </fieldset>

            <div class="button mt-24">
                <button type="submit" class="btn-large white-text blue-bg capitalise">Send</button>
            </div>

        </form>

    </div>
</section>
